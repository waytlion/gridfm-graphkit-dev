task:
  task_name: ST_ForecastOPF
data:
  baseMVA: 100
  mask_value: 0.0
  normalization: HeteroDataMVANormalizer
  networks:
  - case118_ieee
  scenarios:
  - 26280  #! 3yrs= 26280, 24yr=209589
  test_ratio: 0.15 #!
  val_ratio: 0.15 #!
  workers: 12 #!
  preload: True # preload all graphs into RAM before spawning DataLoader workers (requires sufficient RAM)
  split_by_load_scenario_idx: true
  temporal_split: true
  # ST-GNN temporal parameters
  temporal_window: 48       #! W: lookback window (168 hourly snapshots = 1 week)
  forecast_horizon: 24    #! n: number of target steps ahead
model:
  type: ST_GNN_heterogeneous
  # Spatial encoder (mirrors GNS_heterogeneous architecture)
  attention_head: 8
  edge_dim: 10
  hidden_size: 48 #! full model width (LR sweep v2 at production size)
  input_bus_dim: 15
  input_gen_dim: 6
  output_bus_dim: 5         # [Pd, Qd, Qg, Vm, Va]
  output_gen_dim: 1         # [Pg]
  num_layers: 12
  dropout: 0.1              # held at baseline (isolate LR)
  tcn_kernel_size: 3
  use_exogenous: false #Late fusion
  forecast_decoder_mode: per_horizon # shared or per_horizon
  # Final prediction MLP (= decoder)
  mlp_hidden_dim: 1024
  mlp_num_layers: 1
  alpha_teleport: 0.0  # 0.0 = no change; try 0.1 or 0.2
optimizer:
  beta1: 0.9
  beta2: 0.999
  learning_rate: 0.0005    # SWEPT: {1e-4, 5e-4, 1e-3}
  weight_decay: 0.01       # held at baseline (isolate LR)
  lr_decay: 0.7
  lr_patience: 5
training:
  batch_size: 16 #!
  epochs: 300 #! raised ceiling so a slow (small-LR) run can converge instead of being truncated at 200
  horizon_weighting: harmonic
  losses:
    - ST_ForecastBusMSE
    - ST_ForecastGenMSE
    - ST_PhysicsForecastLoss
  loss_weights:
    - 0.5
    - 0.5
    - 0.1
  loss_args:
    - lambda_load: 0.33333333   # held fixed to match the loss_fct_HPO / recipe_HPO baseline
      lambda_opf: 0.66666667
    - {}
    - {}
  accelerator: auto
  devices: auto
  strategy: auto
seed: 0
verbose: true
callbacks:
  patience: 100
  tol: 0
