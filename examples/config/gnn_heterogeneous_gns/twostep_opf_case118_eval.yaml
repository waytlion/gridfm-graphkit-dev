# Two-step OPF surrogate EVALUATION on forecasted loads (Phase 1c).
# Pairs with surrogate_opf_case118.yaml (same model arch, so its checkpoint loads).
# Differences:
#   - task: OptimalPowerFlowTwoStep  -> residual scored vs true realized load
#   - eval_full_as_test: true        -> score the WHOLE forecast eval set (no split)
# Run: `evaluate --config <this> --model_path <ckpt> --normalizer_stats <train stats>
#       --data_path <converter out>/<model>/  --tags approach=surrogate case=case118 ...`
# --normalizer_stats is REQUIRED (no train split to fit a fit_on_train normalizer).
task:
  task_name: OptimalPowerFlowTwoStep
data:
  baseMVA: 100
  mask_value: 0.0
  normalization: HeteroDataMVANormalizer
  networks:
  - case118_ieee
  scenarios:
  - 100000000          # sentinel: caps to dataset size -> use all eval scenarios
  test_ratio: 0.1    
  val_ratio: 0.
  workers: 16
  eval_full_as_test: true
  preload: false   # eval is a single pass -> no benefit; avoids RAM-loading all scenarios
model:
  attention_head: 8
  edge_dim: 10
  hidden_size: 48
  input_bus_dim: 15
  input_gen_dim: 6
  output_bus_dim: 2
  output_gen_dim: 1
  num_layers: 12
  type: GNS_heterogeneous
optimizer:
  beta1: 0.9
  beta2: 0.999
  learning_rate: 0.0001
  lr_decay: 0.7
  lr_patience: 5
training:
  batch_size: 64
  epochs: 200
  loss_weights:
  - 0.1
  - 0.1
  - 0.8
  losses:
  - LayeredWeightedPhysics
  - MaskedGenMSE
  - MaskedBusMSE
  loss_args:
  - base_weight: 0.5
  - {}
  - {}
  accelerator: auto
  devices: auto
  strategy: auto
seed: 0
verbose: true
callbacks:
  patience: 100
  tol: 0
