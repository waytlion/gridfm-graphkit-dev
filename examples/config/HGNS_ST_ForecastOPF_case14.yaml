task:
  task_name: ST_ForecastOPF
data:
  baseMVA: 100
  mask_value: 0.0
  normalization: HeteroDataMVANormalizer
  networks:
  - case14_ieee
  scenarios:
  - 26280  # 3yrs
  test_ratio: 0.15
  val_ratio: 0.15
  workers: 32
  split_by_load_scenario_idx: true
  temporal_split: true
  # ST-GNN temporal parameters
  temporal_window: 48       # W: lookback window (168 hourly snapshots = 1 week)
  forecast_horizon: 1       # n: number of target steps ahead
model:
  type: ST_GNN_heterogeneous
  # Spatial encoder (mirrors GNS_heterogeneous architecture)
  attention_head: 8
  edge_dim: 10
  hidden_size: 48
  input_bus_dim: 15
  input_gen_dim: 6
  output_bus_dim: 5         # [Pd, Qd, Qg, Vm, Va]
  output_gen_dim: 1         # [Pg]
  num_layers: 12
  dropout: 0.1
  # TCN temporal encoder
  tcn_kernel_size: 3
  # Late fusion
  use_exogenous: false
optimizer:
  beta1: 0.9
  beta2: 0.999
  learning_rate: 0.0005
  lr_decay: 0.7
  lr_patience: 5
training:
  batch_size: 48            # reduced from 64 due to B*W folding
  epochs: 200
  losses:
    - ST_ForecastBusMSE
    - ST_ForecastGenMSE
    - ST_PhysicsForecastLoss
  loss_weights:
    - 1.0
    - 0.1
    - 0.1
  loss_args:
    - lambda_load: 0.8      # weight for Pd,Qd MSE
      lambda_opf: 0.2       # weight for Qg,Vm,Va MSE
    - {}
    - {}
  accelerator: auto
  devices: auto
  strategy: auto
seed: 0
verbose: true
callbacks:
  patience: 20
  tol: 0
