# =====================================================================
# E2E ST-GNN ablation: cyclical time features
# =====================================================================
# Identical to harmonic_decaying_weights/base_h24.yaml EXCEPT:
#   - data.append_time_features: true (now the default; kept explicit here)
# The 6 global calendar features (hour/dow/doy sin+cos, matching XGB's
# generate_cyclical_features) are broadcast to every bus at every lookback
# timestep and appended at bus-feature columns 15..20. input_bus_dim stays the
# base physical dim (15); the model auto-adds the 6 time features. Prediction-
# quality only -- not wired into OPF/aggregation.
task:
  task_name: ST_ForecastOPF
data:
  baseMVA: 100
  mask_value: 0.0
  normalization: HeteroDataMVANormalizer
  networks:
  - case118_ieee
  scenarios:
  - 26280  #! 3yrs= 26280, 24yr=209589
  test_ratio: 0.15 #!
  val_ratio: 0.15 #!
  workers: 12 #!
  preload: True # preload all graphs into RAM before spawning DataLoader workers (requires sufficient RAM)
  split_by_load_scenario_idx: true
  temporal_split: true
  # ST-GNN temporal parameters
  temporal_window: 48       #! W: lookback window (168 hourly snapshots = 1 week)
  forecast_horizon: 24    #! n: number of target steps ahead
  # --- Time features are now default ON; kept explicit here ---
  append_time_features: true          # broadcast 6 cyclical calendar features to buses
  time_feature_start_date: "2019-01-01"  # chronological anchor for scenario_id=0
  time_feature_frequency: "h"          # hourly snapshots
model:
  type: ST_GNN_heterogeneous
  # Spatial encoder (mirrors GNS_heterogeneous architecture)
  attention_head: 8
  edge_dim: 10
  hidden_size: 48 #!
  input_bus_dim: 15         # base physical dim; model auto-adds 6 time features
  input_gen_dim: 6
  output_bus_dim: 5         # [Pd, Qd, Qg, Vm, Va]
  output_gen_dim: 1         # [Pg]
  num_layers: 12
  dropout: 0.1
  tcn_kernel_size: 3
  use_exogenous: false #Late fusion
  forecast_decoder_mode: per_horizon # shared or per_horizon
  # Final prediction MLP (= decoder)
  mlp_hidden_dim: 1024
  mlp_num_layers: 1
  alpha_teleport: 0.0  # 0.0 = no change; try 0.1 or 0.2
optimizer:
  beta1: 0.9
  beta2: 0.999
  learning_rate: 0.0005
  lr_decay: 0.7
  lr_patience: 5
training:
  batch_size: 16 #!
  epochs: 200 #!
  horizon_weighting: harmonic
  losses:
    - ST_ForecastBusMSE
    - ST_ForecastGenMSE
    - ST_PhysicsForecastLoss
  loss_weights:
    - 0.5
    - 0.5
    - 0.1
  loss_args:
    - lambda_load: 0.8      # weight for Pd,Qd MSE
      lambda_opf: 0.2       # weight for Qg,Vm,Va MSE
    - {}
    - {}
  accelerator: auto
  devices: auto
  strategy: auto
seed: 0
verbose: true
callbacks:
  patience: 100
  tol: 0
