task:
  task_name: ST_ForecastOPF
data:
  baseMVA: 100
  mask_value: 0.0
  normalization: HeteroDataMVANormalizer
  networks:
  - case118_ieee
  scenarios:
  - 26280  #! 3yrs= 26280, 24yr=209589
  test_ratio: 0.15 #!
  val_ratio: 0.15 #!
  workers: 12 #!
  preload: True # preload all graphs into RAM before spawning DataLoader workers (requires sufficient RAM)
  split_by_load_scenario_idx: true
  temporal_split: true
  # ST-GNN temporal parameters
  temporal_window: 48       #! W: lookback window (168 hourly snapshots = 1 week)
  forecast_horizon: 24    #! n: number of target steps ahead
model:
  type: ST_GNN_heterogeneous
  # Spatial encoder (mirrors GNS_heterogeneous architecture)
  attention_head: 8 
  edge_dim: 10
  hidden_size: 48 #!
  input_bus_dim: 15
  input_gen_dim: 6
  output_bus_dim: 5         # [Pd, Qd, Qg, Vm, Va]
  output_gen_dim: 1         # [Pg]
  num_layers: 12
  dropout: 0.1
  tcn_kernel_size: 3
  use_exogenous: false #Late fusion
  # Final prediction MLP (= decoder) 
  mlp_hidden_dim: 1024    
  mlp_num_layers: 1        
optimizer:
  beta1: 0.9
  beta2: 0.999
  learning_rate: 0.0005
  lr_decay: 0.7
  lr_patience: 5
training:
  batch_size: 32 #!    
  epochs: 200 #!
  losses:
    - ST_ForecastBusMSE
    - ST_ForecastGenMSE
    - ST_PhysicsForecastLoss
  loss_weights:
    - 0.8
    - 0.1
    - 0.1
  loss_args:
    - lambda_load: 0.8      # weight for Pd,Qd MSE
      lambda_opf: 0.2       # weight for Qg,Vm,Va MSE
    - {}
    - {}
  accelerator: auto
  devices: auto
  strategy: auto
seed: 0
verbose: true
callbacks:
  patience: 100
  tol: 0
